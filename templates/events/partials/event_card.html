{% load static %}
<div class="col-12 col-md-6 col-lg-4" id="event-card-{{ event.id }}">
    <div class="card border-0 shadow-sm rounded-4 h-100 d-flex flex-column overflow-hidden bg-white event-item-card transition-all">
        <div class="position-relative" style="height: 180px; {% if thumbnail_url %}background-image: url('{{ thumbnail_url }}'); background-size: cover; background-position: center;{% elif event.get_thumbnail_url %}background-image: url('{{ event.get_thumbnail_url }}'); background-size: cover; background-position: center;{% else %}background: linear-gradient(135deg, #1e293b, #334155);{% endif %}">

            {% if is_published %}
                <span class="badge bg-success position-absolute top-0 start-0 m-3 shadow-sm">PUBLISHED</span>
            {% else %}
                <span class="badge bg-primary position-absolute top-0 start-0 m-3 shadow-sm">{{ photos_count }} PHOTOS</span>
            {% endif %}

            {% if is_admin %}
                <div class="position-absolute top-0 end-0 m-3 d-flex gap-1">
                    <button type="button" class="btn btn-sm btn-dark bg-opacity-75 text-white rounded-circle p-1.5"
                            hx-get="{% url 'events:event_update' event_id=event.id %}"
                            hx-target="#global-modal-content"
                            hx-swap="innerHTML"
                            data-bs-toggle="modal" 
                            data-bs-target="#global-modal"
                            title="Edit Event">
                        <i class="bi bi-pencil-fill small"></i>
                    </button>
                    <button type="button" class="btn btn-sm btn-danger bg-opacity-75 text-white rounded-circle p-1.5"
                            hx-delete="{% url 'events:event_delete' event_id=event.id %}"
                            hx-target="#event-card-{{ event.id }}"
                            hx-swap="outerHTML"
                            hx-confirm="Are you sure you want to delete this event?"
                            title="Delete Event">
                        <i class="bi bi-trash-fill small"></i>
                    </button>
                </div>
            {% endif %}
        </div>

        <!-- Body -->
        <div class="p-4 d-flex flex-column flex-grow-1">
            <div class="d-flex align-items-center justify-content-between mb-2">
                <span class="text-muted small"><i class="bi bi-calendar-event me-1"></i>{{ event.event_date|date:"b d, Y" }}</span>
                <span class="badge bg-light text-dark border small">{{ members_count }} Shooters</span>
            </div>

            <h5 class="fw-bold text-dark mb-1">{{ event.name }}</h5>
            <p class="text-secondary small mb-3"><i class="bi bi-geo-alt me-1"></i>{{ event.location|default:"Location TBD" }}</p>

            <div class="mt-auto pt-3 border-top d-flex gap-2">
                <a href="{% url 'events:event_detail' event_id=event.id %}" class="btn btn-outline-primary btn-sm flex-grow-1 fw-semibold" style="border-radius: 8px;">
                    <i class="bi bi-eye me-1"></i> View Details
                </a>
                <a href="{% url 'photos:upload_photos' event_id=event.id %}" class="btn btn-primary btn-sm px-3 fw-semibold" style="border-radius: 8px;">
                    <i class="bi bi-cloud-arrow-up me-1"></i> Upload
                </a>
            </div>
        </div>
    </div>
</div>
